<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Love Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060208;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            /* MOBILE FIX: Scale down to fit the screen without stretching */
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(6, 2, 8, 0.9);
            color: #ffc7c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

<audio id="bgMusic" src="song.mp3" preload="auto" loop></audio>

<div id="startOverlay">Click to Start</div>

<canvas id="heartCanvas" width="800" height="800"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('startOverlay');
    const bgMusic = document.getElementById('bgMusic');

    // Configuration
    const SC = 21, OY = 20, DURATION = 10, TICK = 16, ANIM = 42, LIFT = 34, GAP = 7;
    const SIZES = [9, 10, 11, 12];
    const FONT = "Arial";
    const BG = [6/255, 2/255, 8/255]; 
    const FLASH = [1.0, 0.78, 0.78];

    // Multilingual Phrases
    const PHRASES = [
        "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
        "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
        "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
        "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
        "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    function heart(a) {
        const x = 16 * Math.pow(Math.sin(a), 3);
        const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
        return [x * SC, y * SC + OY];
    }

    function mix(a, b, k) {
        return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
    }

    function hx(c) {
        const r = Math.floor(Math.max(0, Math.min(1, c[0])) * 255);
        const g = Math.floor(Math.max(0, Math.min(1, c[1])) * 255);
        const b = Math.floor(Math.max(0, Math.min(1, c[2])) * 255);
        return `rgb(${r},${g},${b})`;
    }

    function randUniform(min, max) { return Math.random() * (max - min) + min; }
    function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    const POLY = [];
    for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
    const EDGES = [];
    for (let i = 0; i < POLY.length; i++) EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);

    const YMAX = Math.max(...POLY.map(p => p[1]));
    const YMIN = Math.min(...POLY.map(p => p[1]));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
        let xs = [];
        for (let [[x1, y1], [x2, y2]] of EDGES) {
            if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
            }
        }
        xs.sort((a, b) => a - b);
        let pairs = [];
        for (let i = 0; i < xs.length; i += 2) if (xs[i + 1] !== undefined) pairs.push([xs[i], xs[i + 1]]);
        return pairs;
    }

    function intersect(A, B) {
        let out = [];
        for (let a of A) {
            for (let b of B) {
                let lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
                if (hi - lo > 14) out.push([lo, hi]);
            }
        }
        return out;
    }

    function measureText(text, size) {
        ctx.font = `bold ${size}px ${FONT}`;
        return ctx.measureText(text).width;
    }

    function build() {
        let placed = [];
        let row_h = Math.max(...SIZES) * 1.2 + 4; 
        let half = row_h / 2;
        let y = YMAX - half;

        while (y > YMIN + half) {
            let row = intersect(spans(y + half), spans(y - half));
            for (let [lo, hi] of row) {
                lo += 4; hi -= 4;
                let cur = lo + randUniform(0, 8);
                let line = [];

                while (true) {
                    let fit = null;
                    for (let i = 0; i < 10; i++) {
                        let text = randChoice(PHRASES);
                        let size = randChoice(SIZES);
                        let w = measureText(text, size);
                        if (cur + w <= hi) { fit = { text, size, w }; break; }
                    }
                    if (!fit) break;
                    line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
                    cur += fit.w + GAP;
                }

                if (line.length === 0) continue;
                if (line.length > 1) {
                    let left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
                    line.forEach((it, i) => it.x += left * i / (line.length - 1));
                } else {
                    line[0].x = (lo + hi) / 2;
                }

                line.forEach((it, i) => {
                    let edge = (i === 0 || i === line.length - 1);
                    placed.push({ x: it.x, y: y, text: it.text, size: it.size, edge: edge });
                });
            }
            y -= row_h;
        }

        const wine = [0.58, 0.0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
        placed.forEach(p => {
            let rad = Math.min(1.0, Math.hypot(p.x / (16 * SC), (p.y - CY) / (14.5 * SC)));
            let base = mix(wine, crimson, 0.25 + 0.75 * rad);
            base = mix(base, blood, randUniform(0, 0.35) + (p.edge ? 0.3 : 0));
            p.color = base.map(v => Math.min(1, v));
            p.rad = rad;
        });

        let edges = placed.filter(p => p.edge).sort((a, b) => (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - CY) % (2 * Math.PI)));
        let inner = placed.filter(p => !p.edge).sort((a, b) => -a.rad + randUniform(0, 0.08) - (-b.rad + randUniform(0, 0.08)));
        return [...edges, ...inner];
    }

    const ORDER = build();
    let itemsIndex = 0;
    const RATE = ORDER.length / (DURATION * 1000 / TICK);
    let acc = 0.0, spawning = true, active = [], completed = [];

    function spawn(p) { p.f = 0; p.dx = randUniform(-10, 10); active.push(p); }

    function renderText(p, px, py, fillStyle, sizeOff = 0) {
        ctx.font = `bold ${p.size + sizeOff}px ${FONT}`;
        ctx.fillStyle = fillStyle;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.text, px + 400, -py + 400); 
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        completed.forEach(p => renderText(p, p.x, p.y, hx(p.activeColor || p.color)));

        if (spawning) {
            acc += RATE;
            while (acc >= 1 && itemsIndex < ORDER.length) {
                acc -= 1;
                spawn(ORDER[itemsIndex++]);
            }
            if (itemsIndex >= ORDER.length) spawning = false;
        }

        active = active.filter(p => {
            p.f += 1;
            let u = Math.max(0, Math.min(1, p.f / ANIM));
            let e = 1 - Math.pow(1 - u, 3);
            let px = p.x + p.dx * (1 - e), py = p.y + (1 - e) * LIFT;
            let flash = 0.75 * Math.sin(Math.PI * Math.max(0, Math.min(1, (u - 0.55) / 0.45)));
            let col = mix(mix(BG, p.color, Math.pow(e, 1.5)), FLASH, flash);

            renderText(p, px, py, hx(col));
            if (u >= 1) { completed.push(p); return false; }
            return true;
        });

        if (!spawning && active.length === 0) { shimmerLoop(); return; }
        requestAnimationFrame(draw);
    }

    function shimmerLoop() {
        if (completed.length === 0) return;
        let p = randChoice(completed);
        let orig = p.color;
        p.activeColor = mix(orig, FLASH, 0.6);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        completed.forEach(item => renderText(item, item.x, item.y, hx(item.activeColor || item.color)));

        setTimeout(() => {
            p.activeColor = orig;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            completed.forEach(item => renderText(item, item.x, item.y, hx(item.activeColor || item.color)));
        }, 260);
        setTimeout(shimmerLoop, 140);
    }

    overlay.addEventListener('click', () => {
        bgMusic.play().catch(err => console.log("Audio failed to play:", err));
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
            requestAnimationFrame(draw); 
        }, 500);
    });

</script>
</body>
</html>
